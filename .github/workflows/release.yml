name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    concurrency:
      # Cancel obsolete builds for the same (ref, target) pair. The `release`
      # job runs separately, so a fast follow-up push won't cancel it mid-upload
      # and the macOS `xcrun notarytool submit --wait` step isn't killed mid-submit.
      group: build-${{ github.ref }}-${{ matrix.label }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
            archive: tar
            binary: mute
          - os: macos-latest
            label: macos-x86_64
            target: x86_64-apple-darwin
            archive: tar
            binary: mute
          - os: macos-latest
            label: macos-aarch64
            target: aarch64-apple-darwin
            archive: tar
            binary: mute
          - os: windows-latest
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: mute.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # `matrix.label` includes the target triple (e.g. macos-x86_64 vs
          # macos-aarch64) so two jobs on the macos-latest runner don't
          # stomp each other's cached artifacts.
          shared-key: continuous-${{ matrix.label }}
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --target-dir target

      # ------------------------------------------------------------
      # Windows code-signing (Authenticode)
      # Requires: secrets.WINDOWS_CERT_B64 (base64 .pfx) + secrets.WINDOWS_CERT_PASS
      # Skipped silently on PRs from forks and on repos that haven't set the secrets.
      # ------------------------------------------------------------
      - name: Warn when Windows signing is not configured
        if: matrix.os == 'windows-latest' && env.WINDOWS_CERT_B64 == ''
        run: |
          echo "::warning::Windows signing secrets are not set — published mute.exe will be unsigned. SmartScreen warnings expected."

      - name: Sign Windows binary
        if: matrix.os == 'windows-latest' && env.WINDOWS_CERT_B64 != ''
        env:
          WINDOWS_CERT_B64: ${{ secrets.WINDOWS_CERT_B64 }}
          WINDOWS_CERT_PASS: ${{ secrets.WINDOWS_CERT_PASS }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'mute.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_B64))

          # signtool.exe is part of the Windows 10 SDK shipped with windows-latest.
          $signtool = Get-ChildItem `
            -Path 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' `
            -ErrorAction SilentlyContinue |
            Sort-Object -Property FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            Write-Error 'signtool.exe not found in the Windows 10 SDK on this runner.'
            exit 1
          }

          & $signtool.FullName sign `
            /f $pfx `
            /p $env:WINDOWS_CERT_PASS `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            /d "mute" `
            /du "https://github.com/${{ github.repository }}" `
            "target/${{ matrix.target }}/release/${{ matrix.binary }}"

          & $signtool.FullName verify /pa "target/${{ matrix.target }}/release/${{ matrix.binary }}"

          Remove-Item -Force $pfx

      # ------------------------------------------------------------
      # macOS code-signing (Developer ID)
      # Requires: secrets.APPLE_CERT_B64 (base64 Developer ID .p12) + secrets.APPLE_CERT_PASS
      # Skipped silently otherwise.
      # ------------------------------------------------------------
      - name: Warn when macOS signing is not configured
        if: startsWith(matrix.os, 'macos') && env.APPLE_CERT_B64 == ''
        run: |
          echo "::warning::Apple signing secrets are not set — published mute binary will be un-signed. Gatekeeper will block it on first launch."

      - name: Sign macOS binary
        if: startsWith(matrix.os, 'macos') && env.APPLE_CERT_B64 != ''
        env:
          APPLE_CERT_B64: ${{ secrets.APPLE_CERT_B64 }}
          APPLE_CERT_PASS: ${{ secrets.APPLE_CERT_PASS }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/mute-apple.p12"
          KEYCHAIN="$RUNNER_TEMP/mute-sig.keychain-db"
          echo "$APPLE_CERT_B64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$APPLE_CERT_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # Disambiguate `Developer ID Application` vs `Developer ID Installer`.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep '"Developer ID Application' | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity in keychain — check APPLE_CERT_B64 / APPLE_CERT_PASS."
            exit 1
          fi
          echo "Signing binary with identity: $IDENTITY"

          # Re-unlock immediately before codesign — under step load the
          # Security framework can re-lock the keychain mid-step, producing
          # sporadic 'User interaction is not allowed' errors.
          security unlock-keychain -p "" "$KEYCHAIN" || true

          codesign --force --options runtime --timestamp --sign "$IDENTITY" \
            "target/${{ matrix.target }}/release/${{ matrix.binary }}"

          codesign --verify --verbose=2 --strict \
            "target/${{ matrix.target }}/release/${{ matrix.binary }}"

          # Keep the cert in $RUNNER_TEMP for debugging if verify fails.
          # The runner self-cleans $RUNNER_TEMP at job end.

      - name: Compute build version (date + short SHA)
        id: stamp
        shell: bash
        run: |
          SHORT_SHA="${{ github.sha }}"
          DATE="$(date -u +%Y-%m-%d)"
          echo "VERSION=${DATE}-${SHORT_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Package binary
        env:
          VERSION: ${{ steps.stamp.outputs.VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          NAME="mute-${{ matrix.label }}-${VERSION}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$NAME/"
          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            strip "dist/$NAME/${{ matrix.binary }}"
          fi

          case "${{ matrix.archive }}" in
            tar)
              tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
              echo "ASSET=$NAME.tar.gz" >> "$GITHUB_ENV"
              ;;
            zip)
              (cd dist && zip -qr "$NAME.zip" "$NAME")
              echo "ASSET=$NAME.zip" >> "$GITHUB_ENV"
              ;;
          esac

      # ------------------------------------------------------------
      # macOS notarization (xcrun notarytool)
      # Requires: secrets.APPLE_ID + APPLE_APP_PASS + APPLE_TEAM_ID
      # Notarization is performed on the packaged archive (not the raw binary).
      # Submission with --wait polls Apple servers and can take 2-10 minutes.
      # ------------------------------------------------------------
      - name: Warn when Apple notarization is not configured
        if: startsWith(matrix.os, 'macos') && env.APPLE_ID == ''
        run: |
          echo "::warning::Apple notarization secrets are not set — signed binary will not be notarized. Gatekeeper will require manual approval or the binary may refuse to launch."

      - name: Notarize macOS archive
        if: startsWith(matrix.os, 'macos') && env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASS: ${{ secrets.APPLE_APP_PASS }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ASSET="dist/${{ env.ASSET }}"
          echo "::notice title=Apple notarization::Submitting $ASSET — this typically takes 2-10 minutes."
          # The `| tee` below depends on `set -o pipefail` (set above); without
          # it, a notarize failure followed by a successful `tee` would mark the
          # step green. Do not remove pipefail from the parent shell.
          xcrun notarytool submit "$ASSET" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASS" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json | tee "$RUNNER_TEMP/notary-submission.json"
          echo "::notice title=Apple notarization::Accepted. Gatekeeper will verify the ticket online when users run the binary. Optional: run 'xcrun stapler staple' on the extracted binary for offline validation."

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: publish continuous release
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      # Serialize publishes to the 'continuous' release so a fast second push
      # queues behind the first; without this, two near-simultaneous pushes
      # could both reach softprops/gh-release and race on the tag.
      group: release-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: |
          sha256sum */* | awk -F/ '{ printf "%s  %s\n", $1, $2 }' | sort -o checksums.txt
          cat checksums.txt

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create / update 'continuous' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: 'continuous build (${{ steps.sha.outputs.short }})'
          body: |
            Latest build off `main` — commit `${{ github.sha }}`.

            These binaries reflect the current state of the repository and are
            considered a **prerelease**. Pin to a tagged release
            (e.g. `v0.1.0`) for stability.
          prerelease: true
          fail_on_unmatched_files: true
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/checksums.txt
